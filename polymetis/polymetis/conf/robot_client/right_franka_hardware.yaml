hz: 1000
use_real_time: true
exec: franka_panda_client

robot_client:
  _target_: polymetis.robot_client.executable_robot_client.ExecutableRobotClient
  use_real_time: ${use_real_time}
  metadata_cfg:
    _target_: polymetis.robot_client.metadata.RobotClientMetadata
    default_Kq: [40, 30, 50, 25, 35, 25, 10]
    default_Kqd: [4, 6, 5, 5, 3, 2, 1]
    default_Kx: [750, 750, 750, 15, 15, 15]
    default_Kxd: [37, 37, 37, 2, 2, 2]
    hz: ${hz}
    robot_model_cfg: ${robot_model}
  executable_cfg:
    # FR3 B / right Desk on the fixed switch topology.
    robot_ip: ${env:FRANKA_RIGHT_ROBOT_IP,172.16.0.4}
    control_ip: ${ip}
    control_port: ${port}
    readonly: false
    mock: false
    use_real_time: ${use_real_time}
    hz: ${hz}
    num_dofs: ${robot_model.num_dofs}
    exec: ${exec}
    robot_client_metadata_path: ???

    limit_rate: true
    lpf_cutoff_frequency: 100

    limits: 
      # bounding box of the workspace
      cartesian_pos_upper:
        - 1.85
        - 1.85
        - 1.85
      cartesian_pos_lower:
        - -1.85
        - -1.85
        - -1.85

      # Position bounds follow the installed FR3 Desk URDF. Other limits below retain their existing settings.
      joint_pos_upper: # FR3 factory position bounds; no extra angular inset
        - 2.9007400166666666
        - 1.8360900166666667
        - 2.9007400166666666
        - -0.11693708333333333
        - 2.87630335
        - 4.62163335
        - 3.05083335
      joint_pos_lower: # FR3 factory position bounds; no extra angular inset
        - -2.9007400166666666
        - -1.8360900166666667
        - -2.9007400166666666
        - -3.077020016666667
        - -2.87630335
        - 0.43982265
        - -3.05083335
      joint_vel: #margin: 0.1 rad/s
        - 2.52
        - 2.52
        - 2.52
        - 2.52
        - 5.16
        - 4.08
        - 5.16
      elbow_vel: 2.52      #margin: 0.1 rad/s
      joint_torques:  #margin: 1N for first 4 joints, 0.5N for last 3 joints
        - 86.0
        - 86.0
        - 86.0
        - 86.0
        - 11.5
        - 11.5
        - 11.5

    collision_behavior:
      lower_torque: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      upper_torque: [55.0, 55.0, 55.0, 55.0, 40.0, 40.0, 40.0] # 2026-10-03: J1-J4 40->55 so 60 N presses do not trip joint reflex
      lower_force: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      upper_force: [60.0, 60.0, 60.0, 40.0, 40.0, 40.0] # 2026-10-03: F 40->60 N, motor press needs ~45 N; moments unchanged

    safety_controller:
      is_active: true
      margins: # margin from hard safety limits at which safety controllers start to kick in
        cartesian_pos: 0.05
        joint_pos: 0.05 # spring starts 0.05 rad inside the factory bound, outside the fr3.py HOLD line (0.10)
        joint_vel: 0.5
      stiffness:
        cartesian_pos: 200.0
        joint_pos: 50.0
        joint_vel: 20.0
